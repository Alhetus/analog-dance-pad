name: Build

on:
  push:
    branches:
      - staging
      - master
      - mckyla
  pull_request:
    branches:
      - staging
      - master
      - mckyla
  workflow_dispatch:

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt update && sudo apt install -y clang-format

      - name: Check first-party formatting
        run: |
          cd adp-tool
          find src tests -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) \
            | xargs clang-format --dry-run --Werror

  build-adp-tool-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y build-essential cmake ninja-build libudev-dev libx11-dev

      - name: Configure and build
        run: |
          cd adp-tool
          cmake --preset=default
          cmake --build build

      - name: Run tests
        run: |
          cd adp-tool
          ctest --preset=default

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Build Linux
          path: adp-tool/build/adp-tool

  sanitizers-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y build-essential cmake ninja-build libudev-dev libx11-dev

      - name: ThreadSanitizer tests
        run: |
          cd adp-tool
          cmake --preset=tsan
          cmake --build build-tsan
          ctest --preset=tsan

      - name: Address/UB Sanitizer tests
        run: |
          cd adp-tool
          cmake --preset=asan-ubsan
          cmake --build build-asan
          ctest --preset=asan-ubsan

  build-adp-tool-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Install dependencies
        run: choco install -y cmake

      - name: Configure and build
        run: |
          cd adp-tool
          cmake --preset=default
          cmake --build build --config RelWithDebInfo

      - name: Run tests
        run: |
          cd adp-tool
          ctest --preset=default

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Build Windows
          path: adp-tool/build/adp-tool.exe

  build-adp-firmware:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Install dependencies
        run: pip install platformio

      - name: Build project
        run: |
          cd firmware
          pio run
          mkdir build_artifacts
          cp .pio/build/*/*.adpf build_artifacts/

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Build Firmware
          path: firmware/build_artifacts
